name: Package VPNACIONAL V11
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          find package_v11 -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: |
          node --check package_v11/assets/js/expediente360_v11.js
      - name: Build ZIP
        run: |
          cd package_v11
          zip -r ../VPNACIONAL_EXPEDIENTE360_EXISTENTE_V11_2026-07-23.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: VPNACIONAL_EXPEDIENTE360_EXISTENTE_V11_2026-07-23
          path: VPNACIONAL_EXPEDIENTE360_EXISTENTE_V11_2026-07-23.zip
          retention-days: 7
