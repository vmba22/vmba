name: Package VPNACIONAL V10
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          find package -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build ZIP
        run: |
          cd package
          zip -r ../VPNACIONAL_EXPEDIENTE360_ASISTENTES_V10_2026-07-23.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: VPNACIONAL_EXPEDIENTE360_ASISTENTES_V10_2026-07-23
          path: VPNACIONAL_EXPEDIENTE360_ASISTENTES_V10_2026-07-23.zip
          retention-days: 7
